<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripristino Dati GlowScale</title>
<style>
  body{ font-family:system-ui, sans-serif; background:#fff8f8; padding:20px; color:#4a2138; }
  h1{ color:#c94f7c; font-size:20px; }
  button{ background:#4caf82; color:#fff; border:none; border-radius:8px; padding:14px 20px; font-size:16px; margin:10px 0; cursor:pointer; width:100%; }
  button:disabled{ opacity:.4; }
  table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:14px; }
  td, th{ padding:6px 4px; border-bottom:1px solid #f2dbe6; text-align:left; }
  .status{ font-size:14px; color:#8a6172; margin:10px 0; font-weight:600; }
  .shot{ color:#c94f7c; }
</style>
</head>
<body>

<h1>♻️ Ripristino dati ricostruiti dal PDF</h1>
<p style="font-size:13px; color:#8a6172;">28 righe (27 dal PDF del 13 agosto + il peso di oggi 18 agosto già inserito). Controlla la tabella, poi premi ripristina.</p>

<div class="status" id="status">Pronto per il ripristino.</div>
<button id="restoreBtn">✅ Ripristina questi dati sul server</button>

<table>
  <tr><th>Data</th><th>Peso</th><th>Siringa</th></tr>
  <tbody id="tbody"></tbody>
</table>

<script>
const JSONBIN_ID = '6a44bc97da38895dfe1a20f9';
const JSONBIN_KEY = '$2a$10$VNTj6CT9PBlMxuJPipL3tutUeRZJQGMAkjbIqOyxSGPpiBF7U7p.K';
const BASE = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

const DATA = [{"id": "1755000000000", "date": "2026-06-29", "weightKg": 62.1, "shot": true}, {"id": "1755000000001", "date": "2026-06-30", "weightKg": 61.3, "shot": false}, {"id": "1755000000002", "date": "2026-07-01", "weightKg": 60.9, "shot": false}, {"id": "1755000000003", "date": "2026-07-03", "weightKg": 59.0, "shot": false}, {"id": "1755000000004", "date": "2026-07-06", "weightKg": null, "shot": true}, {"id": "1755000000005", "date": "2026-07-08", "weightKg": 59.3, "shot": false}, {"id": "1755000000006", "date": "2026-07-09", "weightKg": 58.63, "shot": false}, {"id": "1755000000007", "date": "2026-07-13", "weightKg": 58.92, "shot": true}, {"id": "1755000000008", "date": "2026-07-14", "weightKg": 58.4, "shot": false}, {"id": "1755000000009", "date": "2026-07-15", "weightKg": 57.64, "shot": false}, {"id": "1755000000010", "date": "2026-07-19", "weightKg": 57.7, "shot": false}, {"id": "1755000000011", "date": "2026-07-20", "weightKg": 58.2, "shot": true}, {"id": "1755000000012", "date": "2026-07-21", "weightKg": 57.7, "shot": false}, {"id": "1755000000013", "date": "2026-07-22", "weightKg": 57.6, "shot": false}, {"id": "1755000000014", "date": "2026-07-23", "weightKg": 57.2, "shot": false}, {"id": "1755000000015", "date": "2026-07-25", "weightKg": 57.0, "shot": false}, {"id": "1755000000016", "date": "2026-07-26", "weightKg": 56.4, "shot": false}, {"id": "1755000000017", "date": "2026-07-27", "weightKg": 56.5, "shot": true}, {"id": "1755000000018", "date": "2026-07-28", "weightKg": 57.0, "shot": false}, {"id": "1755000000019", "date": "2026-07-29", "weightKg": 56.4, "shot": false}, {"id": "1755000000020", "date": "2026-07-30", "weightKg": 56.3, "shot": false}, {"id": "1755000000021", "date": "2026-07-31", "weightKg": 56.2, "shot": false}, {"id": "1755000000022", "date": "2026-08-01", "weightKg": 56.2, "shot": false}, {"id": "1755000000023", "date": "2026-08-02", "weightKg": null, "shot": true}, {"id": "1755000000024", "date": "2026-08-11", "weightKg": 55.8, "shot": true}, {"id": "1755000000025", "date": "2026-08-12", "weightKg": 55.5, "shot": false}, {"id": "1755000000026", "date": "2026-08-13", "weightKg": 55.2, "shot": false}, {"id": "1755000000027", "date": "2026-08-18", "weightKg": 54.5, "shot": false}];

const tbody = document.getElementById('tbody');
DATA.forEach(e => {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${e.date}</td><td>${e.weightKg !== null ? e.weightKg.toFixed(2) + ' kg' : 'nessun peso'}</td><td class="shot">${e.shot ? '💉' : ''}</td>`;
  tbody.appendChild(tr);
});

function setStatus(t){ document.getElementById('status').textContent = t; }

document.getElementById('restoreBtn').addEventListener('click', async () => {
  if(!confirm(`Sovrascrivere il bin con questi ${DATA.length} record? Questa azione sostituisce tutto il contenuto attuale.`)) return;
  setStatus('Ripristino in corso…');
  document.getElementById('restoreBtn').disabled = true;
  try{
    const res = await fetch(BASE, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify(DATA)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    setStatus('✅ Ripristinato! Apri GlowScale e ricarica — dovresti vedere tutti i dati.');
  }catch(e){
    setStatus('❌ Errore: ' + e.message);
    document.getElementById('restoreBtn').disabled = false;
  }
});
</script>
</body>
</html>
